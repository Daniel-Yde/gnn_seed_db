<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GNN Seed Lab</title>
<style>
:root{--bg:#060b13;--top:#070d17;--side:#08111d;--panel:#0d1726;--panel2:#101d30;--elev:#14243a;--border:#203550;--border2:#2c4969;--text:#f5f8fc;--muted:#93a6be;--sub:#5e718b;--cyan:#2ed7ff;--violet:#806fff;--green:#34d99a;--amber:#ffb84d;--blue:#56a8ff;--pink:#ff76b8;--red:#ff6b7a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}
#app{min-height:100vh}.top{height:72px;background:var(--top);border-bottom:1px solid var(--border);display:flex;align-items:center;position:sticky;top:0;z-index:30}.brand{width:208px;padding-left:24px;color:var(--cyan);font-weight:800;font-size:12px;letter-spacing:.12em}.title{font-size:18px;font-weight:700;flex:1}.badges{display:flex;gap:12px;padding-right:24px}.badge{height:36px;border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:0 13px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.05em}.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.layout{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100vh - 72px)}.sidebar{background:var(--side);padding:18px 16px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.nav-label{font-size:9px;color:var(--sub);font-weight:800;letter-spacing:.12em;margin:6px 2px 12px}.nav{display:block;width:100%;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;border-radius:8px;padding:10px 12px;margin:2px 0;font-size:11px}.nav.sub{padding-left:22px;font-size:10px}.nav:hover{background:var(--panel)}.nav.active{background:var(--elev);border-color:var(--cyan);color:var(--text);box-shadow:inset 3px 0 0 var(--cyan)}.side-footer{margin-top:28px;border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:12px}.side-footer small{display:block;color:var(--sub);font-weight:800;letter-spacing:.08em}.side-footer strong{display:block;margin-top:8px;font-size:11px}.side-footer span{display:block;color:var(--muted);font-size:9px;margin-top:6px}
.main{padding:20px 24px 50px;max-width:1500px;width:100%;margin:0 auto;background-image:linear-gradient(to right,rgba(32,53,80,.13) 1px,transparent 1px),linear-gradient(to bottom,rgba(32,53,80,.13) 1px,transparent 1px);background-size:64px 64px;min-height:calc(100vh - 72px)}.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 0 20px}.page-head h1{font-size:24px;margin:0}.page-head p{color:var(--muted);margin:7px 0 0;max-width:760px;line-height:1.5}.actions{display:flex;gap:8px}.btn{border:1px solid var(--border2);background:var(--panel);color:var(--text);border-radius:9px;padding:9px 12px;font-size:11px;font-weight:700}.btn:hover{border-color:var(--cyan)}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#041018}.btn.danger{border-color:var(--red);color:var(--red)}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.card{border:1px solid var(--border);background:linear-gradient(180deg,rgba(16,29,48,.95),rgba(13,23,38,.95));border-radius:12px;padding:16px}.kpi .label{font-size:9px;color:var(--sub);font-weight:800;letter-spacing:.12em}.kpi .value{font-size:30px;font-weight:800;margin-top:7px}.kpi .hint{font-size:10px;color:var(--muted);margin-top:6px}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.module-card{min-height:160px;position:relative;overflow:hidden}.module-card h3{margin:0 0 8px;font-size:15px}.module-card p{color:var(--muted);font-size:11px;line-height:1.55;margin:0 0 12px}.module-card .accent{height:3px;width:54px;border-radius:2px;background:var(--cyan);margin-bottom:15px}.module-card .stat{font-size:10px;color:var(--sub)}.module-card button{position:absolute;right:14px;bottom:14px}.research{margin-top:14px}.research h3,.card h3{font-size:12px;letter-spacing:.04em;margin:0 0 12px}.rq{display:grid;grid-template-columns:28px 1fr;gap:8px;margin:10px 0;color:var(--muted);line-height:1.5;font-size:11px}.rq b{color:var(--cyan)}
.pipeline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.pipe{border:1px solid var(--border2);background:var(--elev);border-radius:9px;padding:10px 12px;font-size:10px;font-weight:800;letter-spacing:.05em}.arrow{color:var(--sub)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.input,.select,.textarea{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--cyan)}.input{min-width:240px}.select{min-width:140px}.textarea{width:100%;min-height:90px;resize:vertical}.func-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:10px}.func{border:1px solid var(--border);background:rgba(13,23,38,.96);border-radius:10px;padding:13px;text-align:left;color:inherit}.func:hover{border-color:var(--cyan);transform:translateY(-1px)}.func-top{display:flex;justify-content:space-between;gap:8px}.func-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text);word-break:break-all}.chip{display:inline-flex;border:1px solid var(--border2);border-radius:999px;padding:4px 7px;font-size:8px;font-weight:800;letter-spacing:.06em}.TODO{color:var(--amber);border-color:rgba(255,184,77,.45)}.VERIFY{color:var(--violet);border-color:rgba(128,111,255,.5)}.IN_PROGRESS{color:var(--blue);border-color:rgba(86,168,255,.5)}.DONE{color:var(--green);border-color:rgba(52,217,154,.5)}.BLOCKED{color:var(--red);border-color:rgba(255,107,122,.5)}.PLANNED{color:var(--muted)}.func p{color:var(--muted);font-size:10px;line-height:1.45;min-height:29px}.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:9px;gap:8px}.progress{height:6px;background:#08111d;border:1px solid var(--border);border-radius:8px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--cyan)}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--border);font-size:10px}.table th{color:var(--sub);font-size:9px;letter-spacing:.06em}.table td{color:var(--muted)}.table td strong{color:var(--text)}
.drawer-wrap{position:fixed;inset:0;background:rgba(0,0,0,.54);z-index:60;display:none}.drawer-wrap.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(460px,94vw);background:var(--side);border-left:1px solid var(--border2);overflow:auto;padding:20px}.drawer-head{display:flex;justify-content:space-between;gap:15px;align-items:start;border-bottom:1px solid var(--border);padding-bottom:16px}.drawer-head h2{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;margin:0;word-break:break-all}.close{background:transparent;border:0;color:var(--muted);font-size:22px}.field{margin:15px 0}.field label{display:block;color:var(--sub);font-size:9px;font-weight:800;letter-spacing:.08em;margin-bottom:7px}.field .text{color:var(--muted);font-size:11px;line-height:1.55;white-space:pre-wrap}.field code{display:block;background:#050a11;border:1px solid var(--border);border-radius:8px;padding:10px;color:#b8d9ff;font-size:10px;white-space:pre-wrap}.drawer .select,.drawer .input{width:100%;min-width:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.locked{color:var(--amber);font-size:10px}.unlocked{color:var(--green);font-size:10px}.comment{border:1px solid var(--border);border-radius:9px;padding:10px;margin:8px 0}.comment .who{font-size:9px;color:var(--cyan);font-weight:800}.comment .body{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.45}.comment .when{font-size:8px;color:var(--sub);margin-top:6px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--elev);border:1px solid var(--border2);padding:11px 14px;border-radius:10px;z-index:100;display:none;font-size:11px}.toast.show{display:block}.empty{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:900px){.badges{display:none}.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;gap:5px;overflow:auto;padding:8px}.nav-label,.side-footer{display:none}.nav,.nav.sub{min-width:max-content;padding:9px 10px}.kpis,.two,.three{grid-template-columns:1fr 1fr}.main{padding:16px}.brand{width:150px}.title{font-size:15px}.drawer{width:100%}}@media(max-width:560px){.kpis,.two,.three,.row{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column;gap:10px}.input,.select{width:100%;min-width:0}.toolbar>*{flex:1 1 100%}}
</style>
</head>
<body><div id="app"></div><div id="drawer" class="drawer-wrap"></div><div id="toast" class="toast"></div>
<script>
const API="https://frfwjxvchpwsptzncnlp.supabase.co/functions/v1/gnn-seed-lab";let state={functions:[],members:[],comments:[],activity:[]};let page='overview';let selected=null;let search='';let filterStatus='ALL';let filterModule='ALL';
const titles={overview:'Project Overview',training:'Training & Result Storage',seed:'Seed Sensitivity',classes:'Class Analysis',nodes:'Node Stability',degree:'Degree Analysis',hyper:'Hyperparameters',combined:'Combined Analysis',tests:'Hypothesis Tests',plots:'Statistical Plots',visualization:'Graph Visualization',library:'Function Library',status:'Development Status',team:'Team & Assignments'};
const pageModules={training:['Training & Storage'],seed:['Seed Analysis'],classes:['Class Analysis'],nodes:['Node & Degree Analysis'],degree:['Node & Degree Analysis'],hyper:['Hyperparameter Analysis'],combined:['Combined Analysis'],tests:['Combined Analysis','Node & Degree Analysis'],plots:['Statistical Plots'],visualization:['Graph Visualization']};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=s=>String(s||'').replaceAll('_',' ');
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
async function api(payload){const opts=payload?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}:{};const r=await fetch(payload?API+'?api=mutate':API+'?api=state',opts);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){state=await api();render();if(selected)openDrawer(selected.id,false)}
function counts(){const c={};for(const f of state.functions)c[f.status]=(c[f.status]||0)+1;return c}
function memberName(id){return state.members.find(m=>m.id===id)?.display_name||'Unassigned'}
function moduleCount(m){return state.functions.filter(f=>f.module===m).length}
function navButton(id,label,sub=false){return `<button class="nav ${sub?'sub ':''}${page===id?'active':''}" onclick="go('${id}')">${esc(label)}</button>`}
function shell(content){const c=counts();return `<div class="top"><div class="brand">GNN SEED LAB</div><div class="title">${esc(titles[page])}</div><div class="badges"><div class="badge"><span class="dot"></span>LIVE WORKSPACE</div><div class="badge">${state.functions.length} FUNCTIONS • PERSISTENT</div></div></div><div class="layout"><aside class="sidebar"><div class="nav-label">PROJECT</div>${navButton('overview','Overview')}${navButton('training','Training')}${navButton('seed','Seed analysis',true)}${navButton('classes','Class analysis',true)}${navButton('nodes','Node stability',true)}${navButton('degree','Degree analysis',true)}${navButton('hyper','Hyperparameters',true)}${navButton('combined','Combined',true)}${navButton('tests','Hypothesis tests',true)}${navButton('plots','Statistical plots',true)}${navButton('visualization','Visualization')}<div class="nav-label" style="margin-top:20px">PROJECT TOOLS</div>${navButton('library','Function library')}${navButton('status','Development status')}${navButton('team','Team & assignments')}<div class="side-footer"><small>ARCHITECTURE</small><strong>${state.functions.length} functions mapped</strong><span>${c.DONE||0} done • ${c.IN_PROGRESS||0} in progress • ${c.VERIFY||0} verify</span></div></aside><main class="main">${content}</main></div>`}
function head(desc,actions=''){return `<div class="page-head"><div><h1>${esc(titles[page])}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function kpi(label,val,hint){return `<div class="card kpi"><div class="label">${label}</div><div class="value">${val}</div><div class="hint">${hint}</div></div>`}
function funcCard(f){return `<button class="func" onclick="openDrawer('${f.id}')"><div class="func-top"><span class="func-name">${esc(f.name)}</span><span class="chip ${f.status}">${fmt(f.status)}</span></div><p>${esc(f.task||'Function architecture item')}</p><div class="meta"><span>${esc(f.category)}</span><span>${esc(memberName(f.assignee_member_id))}</span></div></button>`}
function overview(){const c=counts();const modules=['Training & Storage','Analysis Infrastructure','Seed Analysis','Class Analysis','Node & Degree Analysis','Hyperparameter Analysis','Combined Analysis','Statistical Plots','Graph Visualization'];return shell(head('Research control center for the GCN seed-sensitivity project. Values below are live from the shared project database.',`<button class="btn" onclick="go('library')">Browse functions</button><button class="btn primary" onclick="go('team')">Team view</button>`)+`<div class="grid kpis">${kpi('FUNCTIONS',state.functions.length,'Mapped project functions')}${kpi('TODO',c.TODO||0,'Not started')}${kpi('IN PROGRESS',c.IN_PROGRESS||0,'Actively being implemented')}${kpi('VERIFY',c.VERIFY||0,'Needs confirmation / review')}</div><div class="grid three">${['Training & Storage','Combined Analysis','Graph Visualization'].map((m,i)=>`<div class="card module-card"><div class="accent" style="background:${['var(--cyan)','var(--violet)','var(--green)'][i]}"></div><h3>${m}</h3><p>${moduleCount(m)} mapped functions. Open the module to inspect current implementation state and assignments.</p><div class="stat">${state.functions.filter(f=>f.module===m&&f.status==='DONE').length} done • ${state.functions.filter(f=>f.module===m&&f.status==='IN_PROGRESS').length} active</div><button class="btn" onclick="go('${i===0?'training':i===1?'combined':'visualization'}')">Open →</button></div>`).join('')}</div><div class="grid two research"><div class="card"><h3>RESEARCH QUESTIONS</h3><div class="rq"><b>01</b><span>How strongly does random seed variation affect overall GCN accuracy on multi-class node classification?</span></div><div class="rq"><b>02</b><span>Which classes and nodes are most sensitive to seed variation?</span></div><div class="rq"><b>03</b><span>How does node degree relate to the probability of correct classification across repeated runs?</span></div><div class="rq"><b>04</b><span>How do dataset split and hyperparameter configuration influence seed sensitivity?</span></div></div><div class="card"><h3>DATA PIPELINE</h3><div class="pipeline"><span class="pipe">TRAIN</span><span class="arrow">→</span><span class="pipe">JSON</span><span class="arrow">→</span><span class="pipe">STATS</span><span class="arrow">→</span><span class="pipe">REPORT</span></div><div style="margin-top:18px;color:var(--muted);font-size:11px;line-height:1.55">Per-seed JSON remains the source of truth. Statistical analysis should be reproducible without retraining. Node summaries are derived artifacts, not substitutes for raw predictions.</div></div></div>`)}
function modulePage(){const mods=pageModules[page]||[];let fs=state.functions.filter(f=>mods.includes(f.module));if(page==='degree')fs=fs.filter(f=>/degree|spearman/i.test(f.name));if(page==='nodes')fs=fs.filter(f=>!/degree|spearman/i.test(f.name));if(page==='tests')fs=state.functions.filter(f=>/test|comparisons|interaction/i.test(f.name));return shell(head('Live implementation board for this research module. Select a function to edit its status, owner, priority, notes, and comments.')+`<div class="func-grid">${fs.map(funcCard).join('')}</div>`)}
function library(){const modules=[...new Set(state.functions.map(f=>f.module))];const filtered=state.functions.filter(f=>(!search||f.name.toLowerCase().includes(search.toLowerCase())||(f.task||'').toLowerCase().includes(search.toLowerCase()))&&(filterStatus==='ALL'||f.status===filterStatus)&&(filterModule==='ALL'||f.module===filterModule));return shell(head('Search and filter the complete function architecture. Every card is backed by persistent database state.')+`<div class="toolbar"><input class="input" placeholder="Search functions…" value="${esc(search)}" oninput="search=this.value;render()"><select class="select" onchange="filterStatus=this.value;render()"><option>ALL</option>${['PLANNED','TODO','IN_PROGRESS','VERIFY','BLOCKED','DONE'].map(x=>`<option ${filterStatus===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" onchange="filterModule=this.value;render()"><option>ALL</option>${modules.map(x=>`<option ${filterModule===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div style="color:var(--sub);font-size:10px;margin-bottom:10px">Showing ${filtered.length} of ${state.functions.length}</div><div class="func-grid">${filtered.map(funcCard).join('')||'<div class="empty">No matching functions</div>'}</div>`)}
function statusPage(){const c=counts();const modules=[...new Set(state.functions.map(f=>f.module))];return shell(head('Development health based on the persistent status of all mapped functions.')+`<div class="grid kpis">${kpi('DONE',c.DONE||0,'Completed')}${kpi('IN PROGRESS',c.IN_PROGRESS||0,'Actively owned')}${kpi('VERIFY',c.VERIFY||0,'Needs verification')}${kpi('BLOCKED',c.BLOCKED||0,'Needs attention')}</div><div class="card"><h3>MODULE COMPLETION</h3>${modules.map(m=>{const fs=state.functions.filter(f=>f.module===m),d=fs.filter(f=>f.status==='DONE').length,p=Math.round(d/fs.length*100);return `<div style="display:grid;grid-template-columns:220px 1fr 70px;gap:12px;align-items:center;margin:13px 0"><span style="font-size:10px">${esc(m)}</span><div class="progress"><span style="width:${p}%"></span></div><span style="font-size:9px;color:var(--muted)">${d}/${fs.length} done</span></div>`}).join('')}</div><div class="card" style="margin-top:14px"><h3>NEXT ATTENTION</h3><div class="func-grid">${state.functions.filter(f=>['BLOCKED','VERIFY','IN_PROGRESS'].includes(f.status)).slice(0,12).map(funcCard).join('')||'<div class="empty">No active blockers or verification items.</div>'}</div></div>`)}
function teamPage(){const rows=state.members.map(m=>{const fs=state.functions.filter(f=>f.assignee_member_id===m.id);const by=s=>fs.filter(f=>f.status===s).length;return `<tr><td><strong>${esc(m.display_name)}</strong></td><td>${fs.length}</td><td>${by('TODO')}</td><td>${by('IN_PROGRESS')}</td><td>${by('VERIFY')}</td><td>${by('DONE')}</td></tr>`}).join('');return shell(head('Shared assignment view. Add members, then assign functions from the function inspector.',`<button class="btn primary" onclick="addMember()">+ Add member</button>`)+`<div class="card"><table class="table"><thead><tr><th>MEMBER</th><th>ASSIGNED</th><th>TODO</th><th>IN PROGRESS</th><th>VERIFY</th><th>DONE</th></tr></thead><tbody>${rows}</tbody></table></div><div class="card" style="margin-top:14px"><h3>UNASSIGNED WORK</h3><div class="func-grid">${state.functions.filter(f=>!f.assignee_member_id).slice(0,18).map(funcCard).join('')}</div></div>`)}
function render(){let body=page==='overview'?overview():page==='library'?library():page==='status'?statusPage():page==='team'?teamPage():modulePage();document.querySelector('#app').innerHTML=body}
function go(p){page=p;selected=null;document.querySelector('#drawer').classList.remove('open');render();scrollTo(0,0)}
function unlocked(){return !!localStorage.getItem('gnnAccessKey')}
async function unlock(){const k=prompt('Enter the shared workspace key');if(!k)return;try{await api({action:'verify_key',key:k});localStorage.setItem('gnnAccessKey',k);toast('Workspace unlocked');if(selected)openDrawer(selected.id,false)}catch(e){toast('Incorrect workspace key')}}
async function mutate(payload){const key=localStorage.getItem('gnnAccessKey');if(!key){await unlock();if(!localStorage.getItem('gnnAccessKey'))return}try{await api({...payload,key:localStorage.getItem('gnnAccessKey')});await load();toast('Saved')}catch(e){if(/key/i.test(e.message)){localStorage.removeItem('gnnAccessKey')}toast(e.message)}}
function openDrawer(id,show=true){selected=state.functions.find(f=>f.id===id);if(!selected)return;const f=selected;const comments=state.comments.filter(c=>c.function_id===id);const drawer=document.querySelector('#drawer');drawer.innerHTML=`<div class="drawer"><div class="drawer-head"><div><div class="chip ${f.status}" style="margin-bottom:10px">${fmt(f.status)}</div><h2>${esc(f.name)}</h2><div style="color:var(--sub);font-size:9px;margin-top:8px">${esc(f.module)} • ${esc(f.category)}</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="field"><label>WORKSPACE</label>${unlocked()?'<span class="unlocked">● Editing unlocked</span> <button class="btn" style="margin-left:8px" onclick="localStorage.removeItem(\'gnnAccessKey\');openDrawer(selected.id,false)">Lock</button>':'<span class="locked">● Read-only</span> <button class="btn primary" style="margin-left:8px" onclick="unlock()">Unlock editing</button>'}</div><div class="row"><div class="field"><label>STATUS</label><select class="select" ${unlocked()?'':'disabled'} onchange="mutate({action:'update_function',id:'${f.id}',patch:{status:this.value}})">${['PLANNED','TODO','IN_PROGRESS','VERIFY','BLOCKED','DONE'].map(x=>`<option ${f.status===x?'selected':''} value="${x}">${fmt(x)}</option>`).join('')}</select></div><div class="field"><label>PRIORITY</label><select class="select" ${unlocked()?'':'disabled'} onchange="mutate({action:'update_function',id:'${f.id}',patch:{priority:this.value}})">${['LOW','MEDIUM','HIGH'].map(x=>`<option ${f.priority===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>ASSIGNED TO</label><select class="select" ${unlocked()?'':'disabled'} onchange="mutate({action:'update_function',id:'${f.id}',patch:{assignee_member_id:this.value||null}})"><option value="">Unassigned</option>${state.members.map(m=>`<option value="${m.id}" ${f.assignee_member_id===m.id?'selected':''}>${esc(m.display_name)}</option>`).join('')}</select></div><div class="field"><label>TASK</label><div class="text">${esc(f.task||'—')}</div></div><div class="field"><label>EXAMPLE OUTPUT</label><code>${esc(f.example_output||'—')}</code></div><div class="field"><label>IMPLEMENTATION PATH</label><input class="input" value="${esc(f.source_path||'')}" ${unlocked()?'':'disabled'} onchange="mutate({action:'update_function',id:'${f.id}',patch:{source_path:this.value}})"></div><div class="field"><label>IMPLEMENTATION NOTES</label><textarea class="textarea" ${unlocked()?'':'disabled'} onblur="if(this.value!==${JSON.stringify(f.implementation_notes||'')}) mutate({action:'update_function',id:'${f.id}',patch:{implementation_notes:this.value}})">${esc(f.implementation_notes||'')}</textarea></div><div class="field"><label>COMMENTS</label>${comments.map(c=>`<div class="comment"><div class="who">${esc(c.author_member?.display_name||'Member')}</div><div class="body">${esc(c.body)}</div><div class="when">${new Date(c.created_at).toLocaleString()}</div></div>`).join('')||'<div class="text">No comments yet.</div>'}${unlocked()?`<div style="margin-top:10px"><select id="commentMember" class="select"><option value="">Choose author…</option>${state.members.map(m=>`<option value="${m.id}">${esc(m.display_name)}</option>`).join('')}</select><textarea id="commentBody" class="textarea" placeholder="Add a note or review comment…" style="margin-top:8px"></textarea><button class="btn primary" onclick="addComment('${f.id}')">Add comment</button></div>`:''}</div></div>`;if(show)drawer.classList.add('open')}
function closeDrawer(){document.querySelector('#drawer').classList.remove('open');selected=null}
async function addComment(fid){const m=document.querySelector('#commentMember').value,b=document.querySelector('#commentBody').value.trim();if(!m||!b){toast('Choose an author and write a comment');return}await mutate({action:'add_comment',function_id:fid,author_member_id:m,body:b})}
async function addMember(){if(!unlocked()){await unlock();if(!unlocked())return}const n=prompt('Member display name');if(n?.trim())await mutate({action:'add_member',display_name:n.trim()})}
document.querySelector('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});load().catch(e=>{document.querySelector('#app').innerHTML='<div class="empty">Failed to load workspace: '+esc(e.message)+'</div>'});setInterval(()=>load().catch(()=>{}),30000);
</script></body></html>
