<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}

.layout{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100vh - 72px)}.sidebar{background:var(--side);padding:18px 16px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.nav-label{font-size:9px;color:var(--sub);font-weight:800;letter-spacing:.12em;margin:6px 2px 12px}.nav{display:block;width:100%;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;border-radius:8px;padding:10px 12px;margin:2px 0;font-size:11px}.nav.sub{padding-left:22px;font-size:10px}.nav:hover{background:var(--panel)}.nav.active{background:var(--elev);border-color:var(--cyan);color:var(--text);box-shadow:inset 3px 0 0 var(--cyan)}.side-footer{margin-top:28px;border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:12px}.side-footer small{display:block;color:var(--sub);font-weight:800;letter-spacing:.08em}.side-footer strong{display:block;margin-top:8px;font-size:11px}.side-footer span{display:block;color:var(--muted);font-size:9px;margin-top:6px}

.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.card{border:1px solid var(--border);background:linear-gradient(180deg,rgba(16,29,48,.95),rgba(13,23,38,.95));border-radius:12px;padding:16px}.kpi .label{font-size:9px;color:var(--sub);font-weight:800;letter-spacing:.12em}.kpi .value{font-size:30px;font-weight:800;margin-top:7px}.kpi .hint{font-size:10px;color:var(--muted);margin-top:6px}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.module-card{min-height:160px;position:relative;overflow:hidden}.module-card h3{margin:0 0 8px;font-size:15px}.module-card p{color:var(--muted);font-size:11px;line-height:1.55;margin:0 0 12px}.module-card .accent{height:3px;width:54px;border-radius:2px;background:var(--cyan);margin-bottom:15px}.module-card .stat{font-size:10px;color:var(--sub)}.module-card button{position:absolute;right:14px;bottom:14px}.research{margin-top:14px}.research h3,.card h3{font-size:12px;letter-spacing:.04em;margin:0 0 12px}.rq{display:grid;grid-template-columns:28px 1fr;gap:8px;margin:10px 0;color:var(--muted);line-height:1.5;font-size:11px}.rq b{color:var(--cyan)}
.pipeline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.pipe{border:1px solid var(--border2);background:var(--elev);border-radius:9px;padding:10px 12px;font-size:10px;font-weight:800;letter-spacing:.05em}.arrow{color:var(--sub)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.input,.select,.textarea{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--cyan)}.input{min-width:240px}.select{min-width:140px}.textarea{width:100%;min-height:90px;resize:vertical}.func-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}.func{border:1px solid var(--border);background:rgba(13,23,38,.96);border-radius:12px;padding:15px;text-align:left;color:inherit;width:100%;display:flex;flex-direction:column;gap:12px;min-height:420px}.func:hover{border-color:var(--cyan);transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,.18)}.func-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.func-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--text);word-break:break-all;font-weight:800}.chip{display:inline-flex;border:1px solid var(--border2);border-radius:999px;padding:4px 7px;font-size:8px;font-weight:800;letter-spacing:.06em;white-space:nowrap}.TODO{color:var(--amber);border-color:rgba(255,184,77,.45)}.VERIFY{color:var(--violet);border-color:rgba(128,111,255,.5)}.IN_PROGRESS{color:var(--blue);border-color:rgba(86,168,255,.5)}.DONE{color:var(--green);border-color:rgba(52,217,154,.5)}.BLOCKED{color:var(--red);border-color:rgba(255,107,122,.5)}.PLANNED{color:var(--muted)}.spec{display:grid;gap:10px}.spec-row{border-top:1px solid rgba(44,73,105,.55);padding-top:9px}.spec-label{display:block;color:var(--cyan);font-size:8px;font-weight:900;letter-spacing:.11em;margin-bottom:4px}.spec-value{display:block;color:var(--muted);font-size:10px;line-height:1.5}.spec-row.why .spec-label{color:var(--violet)}.example{background:#070d17;border:1px solid var(--border);border-radius:8px;padding:9px}.example .spec-label{color:var(--green)}.example code{display:block;color:#b8d9ff;font-size:9px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.meta{display:grid;grid-template-columns:1fr auto;align-items:end;color:var(--sub);font-size:9px;gap:7px;margin-top:auto;padding-top:4px}.meta-left{display:grid;gap:3px}.meta-right{text-align:right}.meta strong{color:var(--text);font-weight:700}.path{grid-column:1/-1;color:var(--sub);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{height:6px;background:#08111d;border:1px solid var(--border);border-radius:8px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--cyan)}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--border);font-size:10px}.table th{color:var(--sub);font-size:9px;letter-spacing:.06em}.table td{color:var(--muted)}.table td strong{color:var(--text)}
.drawer-wrap{position:fixed;inset:0;background:rgba(0,0,0,.54);z-index:60;display:none}.drawer-wrap.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(460px,94vw);background:var(--side);border-left:1px solid var(--border2);overflow:auto;padding:20px}.drawer-head{display:flex;justify-content:space-between;gap:15px;align-items:start;border-bottom:1px solid var(--border);padding-bottom:16px}.drawer-head h2{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;margin:0;word-break:break-all}.close{background:transparent;border:0;color:var(--muted);font-size:22px}.field{margin:15px 0}.field label{display:block;color:var(--sub);font-size:9px;font-weight:800;letter-spacing:.08em;margin-bottom:7px}.field .text{color:var(--muted);font-size:11px;line-height:1.55;white-space:pre-wrap}.field code{display:block;background:#050a11;border:1px solid var(--border);border-radius:8px;padding:10px;color:#b8d9ff;font-size:10px;white-space:pre-wrap}.drawer .select,.drawer .input{width:100%;min-width:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.locked{color:var(--amber);font-size:10px}.unlocked{color:var(--green);font-size:10px}.comment{border:1px solid var(--border);border-radius:9px;padding:10px;margin:8px 0}.comment .who{font-size:9px;color:var(--cyan);font-weight:800}.comment .body{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.45}.comment .when{font-size:8px;color:var(--sub);margin-top:6px}
.effort-row{display:flex;gap:6px;flex-wrap:wrap}.effort-pill{display:inline-flex;align-items:center;border:1px solid var(--border2);border-radius:999px;padding:5px 8px;font-size:8px;font-weight:800;letter-spacing:.045em;background:rgba(86,168,255,.05);color:var(--muted)}.effort-pill b{font-size:9px;color:var(--text);margin-right:2px}.effort-XS,.effort-S{border-color:rgba(52,217,154,.45);color:var(--green);background:rgba(52,217,154,.055)}.effort-M{border-color:rgba(46,215,255,.42);color:var(--cyan);background:rgba(46,215,255,.05)}.effort-L{border-color:rgba(255,184,77,.5);color:var(--amber);background:rgba(255,184,77,.055)}.effort-XL{border-color:rgba(255,107,122,.55);color:var(--red);background:rgba(255,107,122,.055)}.effort-guide{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:10px}.effort-guide .effort-pill{justify-content:center}.warning-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:-2px}.warn-pill{display:inline-flex;align-items:center;border:1px solid var(--border2);border-radius:999px;padding:4px 7px;font-size:8px;font-weight:900;letter-spacing:.06em}.warn-pill.dependency{color:var(--amber);border-color:rgba(255,184,77,.55);background:rgba(255,184,77,.07)}.warn-pill.blocker{color:var(--red);border-color:rgba(255,107,122,.58);background:rgba(255,107,122,.07)}.dep-list{display:grid;gap:8px}.dep-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--border);background:#09111d;border-radius:9px;padding:9px 10px}.dep-main{min-width:0}.dep-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);font-size:10px;word-break:break-word}.dep-meta{color:var(--sub);font-size:8px;margin-top:4px}.dep-bad{border-color:rgba(255,184,77,.45)}.dep-good{border-color:rgba(52,217,154,.28)}.mini-link{border:0;background:transparent;color:var(--cyan);font-size:9px;padding:0;text-align:left}.mini-remove{border:1px solid var(--border);background:transparent;color:var(--red);border-radius:7px;padding:5px 7px;font-size:8px}.attention{border:1px solid rgba(255,184,77,.45);background:rgba(255,184,77,.055);border-radius:10px;padding:11px;margin:10px 0}.attention.blocked{border-color:rgba(255,107,122,.5);background:rgba(255,107,122,.055)}.attention strong{font-size:10px}.attention p{margin:5px 0 0;color:var(--muted);font-size:9px;line-height:1.45}.member-picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.member-pill{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 11px;font-size:10px}.member-pill.active{border-color:var(--cyan);color:var(--text);background:rgba(46,215,255,.08)}.dep-overview{display:grid;gap:10px}.dep-overview-row{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:start;border-bottom:1px solid var(--border);padding:11px 0}.dep-overview-row:last-child{border-bottom:0}.dep-overview-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text)}.dep-tags{display:flex;flex-wrap:wrap;gap:5px}.dep-tag{border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:8px;color:var(--muted)}.dep-tag.bad{border-color:rgba(255,184,77,.5);color:var(--amber)}.work-section{margin-top:14px}.suggestion-list{display:grid;gap:9px}.suggestion-card{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--border);background:linear-gradient(180deg,rgba(13,23,38,.98),rgba(9,17,29,.98));border-radius:11px;padding:12px}.suggestion-card:hover{border-color:var(--cyan)}.suggestion-rank{height:34px;width:34px;border-radius:10px;border:1px solid rgba(46,215,255,.35);background:rgba(46,215,255,.06);display:flex;align-items:center;justify-content:center;color:var(--cyan);font-weight:900;font-size:11px}.suggestion-main{min-width:0}.suggestion-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);font-size:11px;font-weight:800;word-break:break-word}.suggestion-meta{color:var(--sub);font-size:8px;margin-top:4px}.suggestion-reasons{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.reason-pill{border:1px solid var(--border);border-radius:999px;padding:4px 7px;font-size:8px;color:var(--muted);background:rgba(255,255,255,.015)}.reason-pill.strong{border-color:rgba(52,217,154,.4);color:var(--green)}.reason-pill.unlock{border-color:rgba(128,111,255,.42);color:var(--violet)}.suggestion-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.suggestion-intro{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:11px}.suggestion-intro p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.45;max-width:720px}.subtle{color:var(--sub);font-size:9px}.toast{position:fixed;bottom:20px;right:20px;background:var(--elev);border:1px solid var(--border2);padding:11px 14px;border-radius:10px;z-index:100;display:none;font-size:11px}.toast.show{display:block}.empty{text-align:center;padding:40px;color:var(--muted)}

<body><div id="app"></div><div id="drawer" class="drawer-wrap"></div><div id="toast" class="toast"></div>
<script>
const API="https://frfwjxvchpwsptzncnlp.supabase.co/functions/v1/gnn-seed-lab";let state={functions:[],members:[],comments:[],activity:[],dependencies:[]};let page='overview';let selected=null;let search='';let filterStatus='ALL';let filterModule='ALL';let filterEffort='ALL';let suggestionOffset=0;
const titles={overview:'Project Overview',training:'Training & Result Storage',seed:'Seed Sensitivity',classes:'Class Analysis',nodes:'Node Stability',degree:'Degree Analysis',hyper:'Hyperparameters',combined:'Combined Analysis',tests:'Hypothesis Tests',plots:'Statistical Plots',visualization:'Graph Visualization',mywork:'My Work',dependencies:'Function Dependencies',library:'Function Library',status:'Development Status',team:'Team & Assignments'};
const pageModules={training:['Training & Storage'],seed:['Seed Analysis'],classes:['Class Analysis'],nodes:['Node & Degree Analysis'],degree:['Node & Degree Analysis'],hyper:['Hyperparameter Analysis'],combined:['Combined Analysis'],tests:['Combined Analysis','Node & Degree Analysis'],plots:['Statistical Plots'],visualization:['Graph Visualization']};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=s=>String(s||'').replaceAll('_',' ');
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
async function api(payload){const opts=payload?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}:{};const r=await fetch(payload?API+'?api=mutate':API+'?api=state',opts);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){state=await api();render();if(selected)openDrawer(selected.id,false)}
function counts(){const c={};for(const f of state.functions)c[f.status]=(c[f.status]||0)+1;return c}
function memberName(id){return state.members.find(m=>m.id===id)?.display_name||'Unassigned'}
function moduleCount(m){return state.functions.filter(f=>f.module===m).length}
function fnById(id){return state.functions.find(f=>f.id===id)}
function depsFor(id){return state.dependencies.filter(d=>d.function_id===id).map(d=>fnById(d.depends_on_id)).filter(Boolean)}
function usedBy(id){return state.dependencies.filter(d=>d.depends_on_id===id).map(d=>fnById(d.function_id)).filter(Boolean)}
function dependencyReady(f){return f&&['DONE','VERIFY'].includes(f.status)}
function unreadyDeps(f){return depsFor(f.id).filter(d=>!dependencyReady(d))}
function attentionReasons(f){const r=[];const u=unreadyDeps(f);if(u.length)r.push(u.length+' unfinished '+(u.length===1?'dependency':'dependencies'));if(f.status==='BLOCKED')r.push(f.blocked_reason?.trim()?f.blocked_reason.trim():'Blocker reason missing');return r}
function warningBadge(f){const u=unreadyDeps(f);const bits=[];if(u.length)bits.push(`<span class="warn-pill dependency">⚠ ${u.length} DEP</span>`);if(f.status==='BLOCKED')bits.push(`<span class="warn-pill blocker">BLOCKER</span>`);return bits.length?`<div class="warning-row">${bits.join('')}</div>`:''}
function dueText(f){if(!f.due_date)return '';const d=new Date(f.due_date+'T00:00:00');return Number.isNaN(d.getTime())?'':d.toLocaleDateString()}
const EFFORT={XS:{time:'15–30m',difficulty:'Easy',min:15,max:30},S:{time:'30–60m',difficulty:'Easy',min:30,max:60},M:{time:'1–2h',difficulty:'Moderate',min:60,max:120},L:{time:'2–4h',difficulty:'Hard',min:120,max:240},XL:{time:'4–8h',difficulty:'Very hard',min:240,max:480}};
function effortInfo(t){return EFFORT[t]||EFFORT.M}
function effortBadge(f){const t=f.effort_tier||'M',e=effortInfo(t);return `<span class="effort-pill effort-${t}" title="Estimated implementation effort"><b>${t}</b> · ${e.time} · ${e.difficulty}</span>`}
function effortGuide(){return `<div class="effort-guide">${Object.entries(EFFORT).map(([t,e])=>`<span class="effort-pill effort-${t}"><b>${t}</b> · ${e.time}</span>`).join('')}</div>`}
function suggestionScore(f,memberId){
  const effort={XS:28,S:24,M:17,L:9,XL:3}[f.effort_tier]||12;
  const priority={HIGH:32,MEDIUM:17,LOW:6}[f.priority]||10;
  const assigned=f.assignee_member_id===memberId?35:0;
  const unlock=Math.min(usedBy(f.id).length*4,24);
  const status=f.status==='TODO'?9:4;
  const prerequisiteBonus=depsFor(f.id).length===0?6:3;
  return effort+priority+assigned+unlock+status+prerequisiteBonus;
}
function suggestionReasons(f,memberId){
  const out=[];
  if(f.assignee_member_id===memberId)out.push({text:'Already assigned to you',kind:'strong'});
  if(f.priority==='HIGH')out.push({text:'High priority',kind:'strong'});
  if(['XS','S'].includes(f.effort_tier))out.push({text:'Short implementation',kind:'strong'});
  const downstream=usedBy(f.id).length;if(downstream)out.push({text:'Unlocks '+downstream+' downstream '+(downstream===1?'function':'functions'),kind:'unlock'});
  out.push({text:depsFor(f.id).length?'Prerequisites ready':'No prerequisites',kind:''});
  return out.slice(0,4);
}
function suggestedFunctions(memberId){
  return state.functions.filter(f=>
    ['TODO','PLANNED'].includes(f.status)&&
    f.status!=='BLOCKED'&&
    unreadyDeps(f).length===0&&
    (!f.assignee_member_id||f.assignee_member_id===memberId)
  ).sort((a,b)=>suggestionScore(b,memberId)-suggestionScore(a,memberId)||a.sort_order-b.sort_order);
}
function suggestionCard(f,memberId,rank){
  const reasons=suggestionReasons(f,memberId);
  return `<div class="suggestion-card"><div class="suggestion-rank">#${rank}</div><div class="suggestion-main"><div class="suggestion-name">${esc(f.name)}</div><div class="suggestion-meta">${esc(f.module)} · ${fmt(f.status)} · ${esc(f.priority)} priority</div><div class="effort-row" style="margin-top:7px">${effortBadge(f)}</div><div class="suggestion-reasons">${reasons.map(r=>`<span class="reason-pill ${r.kind}">${esc(r.text)}</span>`).join('')}</div></div><div class="suggestion-actions"><button class="btn" onclick="openDrawer('${f.id}')">Open</button><button class="btn primary" onclick="startSuggestion('${f.id}','${memberId}')">Start this</button></div></div>`;
}
function cycleSuggestions(total){suggestionOffset=total>4?(suggestionOffset+4)%total:0;render()}
async function startSuggestion(fid,memberId){const f=fnById(fid);const patch={status:'IN_PROGRESS'};if(!f?.assignee_member_id)patch.assignee_member_id=memberId;await mutate({action:'update_function',id:fid,patch})}
function setMyMember(id){localStorage.setItem('myMemberId',id);suggestionOffset=0;render()}
function navButton(id,label,sub=false){return `<button class="nav ${sub?'sub ':''}${page===id?'active':''}" onclick="go('${id}')">${esc(label)}</button>`}
function shell(content){const c=counts();return `<div class="top"><div class="brand">GNN SEED LAB</div><div class="title">${esc(titles[page])}</div><div class="badges"><div class="badge"><span class="dot"></span>LIVE WORKSPACE</div><div class="badge">${state.functions.length} FUNCTIONS • PERSISTENT</div></div></div><div class="layout"><aside class="sidebar"><div class="nav-label">PROJECT</div>${navButton('overview','Overview')}${navButton('training','Training')}${navButton('seed','Seed analysis',true)}${navButton('classes','Class analysis',true)}${navButton('nodes','Node stability',true)}${navButton('degree','Degree analysis',true)}${navButton('hyper','Hyperparameters',true)}${navButton('combined','Combined',true)}${navButton('tests','Hypothesis tests',true)}${navButton('plots','Statistical plots',true)}${navButton('visualization','Visualization')}<div class="nav-label" style="margin-top:20px">PROJECT TOOLS</div>${navButton('mywork','My Work')}${navButton('dependencies','Dependencies')}${navButton('library','Function library')}${navButton('status','Development status')}${navButton('team','Team & assignments')}<div class="side-footer"><small>ARCHITECTURE</small><strong>${state.functions.length} functions mapped</strong><span>${c.DONE||0} done • ${c.IN_PROGRESS||0} in progress • ${c.VERIFY||0} verify</span></div></aside><main class="main">${content}</main></div>`}
function head(desc,actions=''){return `<div class="page-head"><div><h1>${esc(titles[page])}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function kpi(label,val,hint){return `<div class="card kpi"><div class="label">${label}</div><div class="value">${val}</div><div class="hint">${hint}</div></div>`}
function funcCard(f){return `<button class="func" onclick="openDrawer('${f.id}')"><div class="func-top"><span class="func-name">${esc(f.name)}</span><span class="chip ${f.status}">${fmt(f.status)}</span></div><div class="effort-row">${effortBadge(f)}</div>${warningBadge(f)}${f.implementation_notes?.trim()?'<div class="warning-row"><span class="warn-pill" style="color:var(--blue);border-color:rgba(86,168,255,.45)">NOTES SAVED</span></div>':''}<div class="spec"><div class="spec-row"><span class="spec-label">WHAT IT DOES</span><span class="spec-value">${esc(f.what_it_does||f.task||'—')}</span></div><div class="spec-row"><span class="spec-label">INPUT</span><span class="spec-value">${esc(f.input_description||'—')}</span></div><div class="spec-row"><span class="spec-label">OUTPUT</span><span class="spec-value">${esc(f.output_description||'—')}</span></div><div class="spec-row why"><span class="spec-label">WHY WE NEED IT</span><span class="spec-value">${esc(f.rationale||'—')}</span></div>${f.implementation_notes?.trim()?`<div class="spec-row"><span class="spec-label" style="color:var(--blue)">IMPLEMENTATION NOTES</span><span class="spec-value">${esc(f.implementation_notes)}</span></div>`:''}</div><div class="example"><span class="spec-label">EXAMPLE OUTPUT</span><code>${esc(f.example_output||'—')}</code></div><div class="meta"><div class="meta-left"><span>${esc(f.module)}</span><span>${esc(f.category)}</span>${dueText(f)?`<span>Due ${esc(dueText(f))}</span>`:''}</div><div class="meta-right"><strong>${esc(memberName(f.assignee_member_id))}</strong><br>${esc(f.priority||'MEDIUM')} priority</div>${f.source_path?`<div class="path" title="${esc(f.source_path)}">${esc(f.source_path)}</div>`:''}</div></button>`}
function overview(){const c=counts();const modules=['Training & Storage','Analysis Infrastructure','Seed Analysis','Class Analysis','Node & Degree Analysis','Hyperparameter Analysis','Combined Analysis','Statistical Plots','Graph Visualization'];return shell(head('Research control center for the GCN seed-sensitivity project. Values below are live from the shared project database.',`<button class="btn" onclick="go('library')">Browse functions</button><button class="btn primary" onclick="go('team')">Team view</button>`)+`<div class="grid kpis">${kpi('FUNCTIONS',state.functions.length,'Mapped project functions')}${kpi('TODO',c.TODO||0,'Not started')}${kpi('IN PROGRESS',c.IN_PROGRESS||0,'Actively being implemented')}${kpi('VERIFY',c.VERIFY||0,'Needs confirmation / review')}</div><div class="grid three">${['Training & Storage','Combined Analysis','Graph Visualization'].map((m,i)=>`<div class="card module-card"><div class="accent" style="background:${['var(--cyan)','var(--violet)','var(--green)'][i]}"></div><h3>${m}</h3><p>${moduleCount(m)} mapped functions. Open the module to inspect current implementation state and assignments.</p><div class="stat">${state.functions.filter(f=>f.module===m&&f.status==='DONE').length} done • ${state.functions.filter(f=>f.module===m&&f.status==='IN_PROGRESS').length} active</div><button class="btn" onclick="go('${i===0?'training':i===1?'combined':'visualization'}')">Open →</button></div>`).join('')}</div><div class="grid two research"><div class="card"><h3>RESEARCH QUESTIONS</h3><div class="rq"><b>01</b><span>How strongly does random seed variation affect overall GCN accuracy on multi-class node classification?</span></div><div class="rq"><b>02</b><span>Which classes and nodes are most sensitive to seed variation?</span></div><div class="rq"><b>03</b><span>How does node degree relate to the probability of correct classification across repeated runs?</span></div><div class="rq"><b>04</b><span>How do dataset split and hyperparameter configuration influence seed sensitivity?</span></div></div><div class="card"><h3>DATA PIPELINE</h3><div class="pipeline"><span class="pipe">TRAIN</span><span class="arrow">→</span><span class="pipe">JSON</span><span class="arrow">→</span><span class="pipe">STATS</span><span class="arrow">→</span><span class="pipe">REPORT</span></div><div style="margin-top:18px;color:var(--muted);font-size:11px;line-height:1.55">Per-seed JSON remains the source of truth. Statistical analysis should be reproducible without retraining. Node summaries are derived artifacts, not substitutes for raw predictions.</div></div></div>`)}
function modulePage(){const mods=pageModules[page]||[];let fs=state.functions.filter(f=>mods.includes(f.module));if(page==='degree')fs=fs.filter(f=>/degree|spearman/i.test(f.name));if(page==='nodes')fs=fs.filter(f=>!/degree|spearman/i.test(f.name));if(page==='tests')fs=state.functions.filter(f=>/test|comparisons|interaction/i.test(f.name));return shell(head('Live implementation board for this research module. Select a function to edit its status, owner, priority, notes, and comments.')+`<div class="func-grid">${fs.map(funcCard).join('')}</div>`)}
function library(){const modules=[...new Set(state.functions.map(f=>f.module))];const filtered=state.functions.filter(f=>(!search||f.name.toLowerCase().includes(search.toLowerCase())||[(f.task||''),(f.what_it_does||''),(f.input_description||''),(f.output_description||''),(f.rationale||'')].some(x=>x.toLowerCase().includes(search.toLowerCase())))&&(filterStatus==='ALL'||f.status===filterStatus)&&(filterModule==='ALL'||f.module===filterModule)&&(filterEffort==='ALL'||f.effort_tier===filterEffort));return shell(head('Search and filter the complete function architecture. Effort estimates represent expected implementation time and can be refined by the team.')+`<div class="card" style="margin-bottom:14px"><div class="subtle">EFFORT SCALE</div>${effortGuide()}</div><div class="toolbar"><input class="input" placeholder="Search functions…" value="${esc(search)}" oninput="search=this.value;render()"><select class="select" onchange="filterStatus=this.value;render()"><option>ALL</option>${['PLANNED','TODO','IN_PROGRESS','VERIFY','BLOCKED','DONE'].map(x=>`<option ${filterStatus===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" onchange="filterEffort=this.value;render()"><option value="ALL">ALL EFFORT</option>${['XS','S','M','L','XL'].map(x=>`<option value="${x}" ${filterEffort===x?'selected':''}>${x} · ${effortInfo(x).time} · ${effortInfo(x).difficulty}</option>`).join('')}</select><select class="select" onchange="filterModule=this.value;render()"><option>ALL</option>${modules.map(x=>`<option ${filterModule===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div style="color:var(--sub);font-size:10px;margin-bottom:10px">Showing ${filtered.length} of ${state.functions.length}</div><div class="func-grid">${filtered.map(funcCard).join('')||'<div class="empty">No matching functions</div>'}</div>`)}
function statusPage(){const c=counts();const modules=[...new Set(state.functions.map(f=>f.module))],warn=state.functions.filter(f=>unreadyDeps(f).length);return shell(head('Development health based on persistent status, blockers, and prerequisite readiness.')+`<div class="grid kpis">${kpi('DONE',c.DONE||0,'Completed')}${kpi('IN PROGRESS',c.IN_PROGRESS||0,'Actively owned')}${kpi('BLOCKED',c.BLOCKED||0,'Explicit blockers')}${kpi('DEP WARNINGS',warn.length,'Functions waiting on prerequisites')}</div><div class="card"><h3>MODULE COMPLETION</h3>${modules.map(m=>{const fs=state.functions.filter(f=>f.module===m),d=fs.filter(f=>f.status==='DONE').length,p=Math.round(d/fs.length*100);return `<div style="display:grid;grid-template-columns:220px 1fr 70px;gap:12px;align-items:center;margin:13px 0"><span style="font-size:10px">${esc(m)}</span><div class="progress"><span style="width:${p}%"></span></div><span style="font-size:9px;color:var(--muted)">${d}/${fs.length} done</span></div>`}).join('')}</div><div class="card" style="margin-top:14px"><h3>DEPENDENCY WARNINGS</h3>${warn.slice(0,15).map(f=>`<div class="attention ${f.status==='BLOCKED'?'blocked':''}"><strong><button class="mini-link" onclick="openDrawer('${f.id}')">${esc(f.name)}</button></strong><p>Waiting on: ${unreadyDeps(f).map(d=>esc(d.name)+' ('+fmt(d.status)+')').join(', ')}</p></div>`).join('')||'<div class="empty">No unfinished dependency warnings.</div>'}</div><div class="card" style="margin-top:14px"><h3>NEXT ATTENTION</h3><div class="func-grid">${state.functions.filter(f=>['BLOCKED','VERIFY','IN_PROGRESS'].includes(f.status)).slice(0,12).map(funcCard).join('')||'<div class="empty">No active blockers or verification items.</div>'}</div></div>`)}

function dependenciesPage(){const withDeps=state.functions.filter(f=>depsFor(f.id).length),warn=withDeps.filter(f=>unreadyDeps(f).length),edges=state.dependencies.length;return shell(head('Direct function prerequisites. A dependency is considered ready when it is DONE or VERIFY; other states produce an automatic warning.')+`<div class="grid kpis">${kpi('RELATIONSHIPS',edges,'Direct prerequisite links')}${kpi('DEPENDENT FUNCTIONS',withDeps.length,'Functions with at least one prerequisite')}${kpi('WARNINGS',warn.length,'Functions with unfinished prerequisites')}${kpi('BLOCKED',state.functions.filter(f=>f.status==='BLOCKED').length,'Explicitly blocked functions')}</div><div class="card"><h3>DEPENDENCY MAP</h3><div class="dep-overview">${withDeps.map(f=>{const ds=depsFor(f.id),u=unreadyDeps(f);return `<div class="dep-overview-row"><div><button class="mini-link dep-overview-label" onclick="openDrawer('${f.id}')">${esc(f.name)}</button><div class="subtle">${esc(f.module)}</div></div><div><div class="subtle" style="margin-bottom:5px">DEPENDS ON</div><div class="dep-tags">${ds.map(d=>`<span class="dep-tag ${dependencyReady(d)?'':'bad'}">${esc(d.name)} · ${fmt(d.status)}</span>`).join('')}</div></div><div><div class="subtle" style="margin-bottom:5px">USED BY</div><div class="dep-tags">${usedBy(f.id).slice(0,6).map(d=>`<span class="dep-tag">${esc(d.name)}</span>`).join('')||'<span class="subtle">No downstream functions</span>'}</div>${u.length?`<div class="warning-row" style="margin-top:8px"><span class="warn-pill dependency">⚠ ${u.length} unfinished</span></div>`:''}</div></div>`}).join('')}</div></div>`)}

function myWorkPage(){
  let id=localStorage.getItem('myMemberId');
  if(!state.members.some(m=>m.id===id))id=state.members[0]?.id||'';
  const m=state.members.find(x=>x.id===id);
  const fs=state.functions.filter(f=>f.assignee_member_id===id);
  const attention=fs.filter(f=>attentionReasons(f).length);
  const inProgress=fs.filter(f=>f.status==='IN_PROGRESS').length;
  const blocked=fs.filter(f=>f.status==='BLOCKED').length;
  const depWarn=fs.filter(f=>unreadyDeps(f).length).length;
  const ranked=suggestedFunctions(id);
  if(suggestionOffset>=ranked.length)suggestionOffset=0;
  const suggestions=ranked.slice(suggestionOffset,suggestionOffset+4);
  if(suggestions.length<4&&suggestionOffset>0)suggestions.push(...ranked.slice(0,4-suggestions.length));
  return shell(head('Personal assignment view with a small ranked set of sensible functions to start next.')+`<div class="card"><div class="member-picker">${state.members.map(x=>`<button class="member-pill ${x.id===id?'active':''}" onclick="setMyMember('${x.id}')">${esc(x.display_name)}</button>`).join('')}</div></div>${m?`<div class="grid kpis" style="margin-top:14px">${kpi('ASSIGNED',fs.length,'Functions owned by '+esc(m.display_name))}${kpi('IN PROGRESS',inProgress,'Active implementation')}${kpi('BLOCKED',blocked,'Explicit blockers')}${kpi('DEP WARNINGS',depWarn,'Waiting on prerequisites')}</div><div class="card work-section"><div class="suggestion-intro"><div><h3 style="margin-bottom:0">FUNCTION SUGGESTIONS</h3><p>Four recommended functions that are ready to start and not owned by another team member. Ranking balances priority, effort, and how much downstream work the function unlocks.</p></div>${ranked.length>4?`<button class="btn" onclick="cycleSuggestions(${ranked.length})">Show other suggestions</button>`:''}</div><div class="suggestion-list">${suggestions.map((f,i)=>suggestionCard(f,id,i+1)).join('')||'<div class="empty">No functions are currently ready to suggest. Check dependency warnings for what needs to finish first.</div>'}</div></div><div class="card work-section"><h3>NEEDS ATTENTION</h3>${attention.map(f=>`<div class="attention ${f.status==='BLOCKED'?'blocked':''}"><strong><button class="mini-link" onclick="openDrawer('${f.id}')">${esc(f.name)}</button> · ${fmt(f.status)}</strong><p>${attentionReasons(f).map(esc).join(' • ')}</p></div>`).join('')||'<div class="empty">Nothing currently needs attention.</div>'}</div><div class="card work-section"><h3>ASSIGNED WORK</h3><div class="func-grid">${fs.map(funcCard).join('')||'<div class="empty">No functions assigned yet.</div>'}</div></div>`:'<div class="empty">No team members available.</div>'}`)}


function teamPage(){const rows=state.members.map(m=>{const fs=state.functions.filter(f=>f.assignee_member_id===m.id);const by=s=>fs.filter(f=>f.status===s).length;return `<tr><td><strong>${esc(m.display_name)}</strong></td><td>${fs.length}</td><td>${by('TODO')}</td><td>${by('IN_PROGRESS')}</td><td>${by('VERIFY')}</td><td>${by('DONE')}</td></tr>`}).join('');return shell(head('Shared assignment view. Assigning TODO/PLANNED work automatically moves it to IN PROGRESS across the whole workspace.',`<button class="btn" onclick="go('mywork')">Open My Work</button><button class="btn primary" onclick="addMember()">+ Add member</button>`)+`<div class="card"><table class="table"><thead><tr><th>MEMBER</th><th>ASSIGNED</th><th>TODO</th><th>IN PROGRESS</th><th>VERIFY</th><th>DONE</th></tr></thead><tbody>${rows}</tbody></table></div><div class="card" style="margin-top:14px"><h3>UNASSIGNED WORK</h3><div class="func-grid">${state.functions.filter(f=>!f.assignee_member_id).slice(0,18).map(funcCard).join('')}</div></div>`)}
function render(){let body=page==='overview'?overview():page==='mywork'?myWorkPage():page==='dependencies'?dependenciesPage():page==='library'?library():page==='status'?statusPage():page==='team'?teamPage():modulePage();document.querySelector('#app').innerHTML=body}
function go(p){page=p;selected=null;document.querySelector('#drawer').classList.remove('open');render();scrollTo(0,0)}
function unlocked(){return !!localStorage.getItem('gnnAccessKey')}
async function unlock(){const k=prompt('Enter the shared workspace key');if(!k)return;try{await api({action:'verify_key',key:k});localStorage.setItem('gnnAccessKey',k);toast('Workspace unlocked');if(selected)openDrawer(selected.id,false)}catch(e){toast('Incorrect workspace key')}}
async function mutate(payload){const key=localStorage.getItem('gnnAccessKey');if(!key){await unlock();if(!localStorage.getItem('gnnAccessKey'))return}try{await api({...payload,key:localStorage.getItem('gnnAccessKey')});await load();toast('Saved')}catch(e){if(/key/i.test(e.message)){localStorage.removeItem('gnnAccessKey')}toast(e.message)}}
function openDrawer(id,show=true){selected=state.functions.find(f=>f.id===id);if(!selected)return;const f=selected,comments=state.comments.filter(c=>c.function_id===id),deps=depsFor(id),down=usedBy(id),unfinished=unreadyDeps(f),depIds=new Set(deps.map(d=>d.id)),candidates=state.functions.filter(x=>x.id!==id&&!depIds.has(x.id));const drawer=document.querySelector('#drawer');drawer.innerHTML=`<div class="drawer"><div class="drawer-head"><div><div class="chip ${f.status}" style="margin-bottom:10px">${fmt(f.status)}</div><h2>${esc(f.name)}</h2><div style="color:var(--sub);font-size:9px;margin-top:8px">${esc(f.module)} • ${esc(f.category)}</div><div class="effort-row" style="margin-top:9px">${effortBadge(f)}</div>${warningBadge(f)}</div><button class="close" onclick="closeDrawer()">×</button></div><div class="field"><label>WORKSPACE</label>${unlocked()?'<span class="unlocked">● Editing unlocked</span> <button class="btn" style="margin-left:8px" onclick="localStorage.removeItem(\'gnnAccessKey\');openDrawer(selected.id,false)">Lock</button>':'<span class="locked">● Read-only</span> <button class="btn primary" style="margin-left:8px" onclick="unlock()">Unlock editing</button>'}</div><div class="row"><div class="field"><label>STATUS</label><select class="select" ${unlocked()?'':'disabled'} onchange="mutate({action:'update_function',id:'${f.id}',patch:{status:this.value}})">${['PLANNED','TODO','IN_PROGRESS','VERIFY','BLOCKED','DONE'].map(x=>`<option ${f.status===x?'selected':''} value="${x}">${fmt(x)}</option>`).join('')}</select></div><div class="field"><label>PRIORITY</label><select class="select" ${unlocked()?'':'disabled'} onchange="mutate({action:'update_function',id:'${f.id}',patch:{priority:this.value}})">${['LOW','MEDIUM','HIGH'].map(x=>`<option ${f.priority===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>EFFORT ESTIMATE</label><select class="select" ${unlocked()?'':'disabled'} onchange="mutate({action:'update_function',id:'${f.id}',patch:{effort_tier:this.value}})">${['XS','S','M','L','XL'].map(x=>{const e=effortInfo(x);return `<option value="${x}" ${f.effort_tier===x?'selected':''}>${x} · ${e.time} · ${e.difficulty}</option>`}).join('')}</select><div class="subtle" style="margin-top:6px">Estimated implementation effort, not calendar duration.</div></div><div class="field"><label>ASSIGNED TO</label><select class="select" ${unlocked()?'':'disabled'} onchange="mutate({action:'update_function',id:'${f.id}',patch:{assignee_member_id:this.value||null}})"><option value="">Unassigned</option>${state.members.map(m=>`<option value="${m.id}" ${f.assignee_member_id===m.id?'selected':''}>${esc(m.display_name)}</option>`).join('')}</select><div class="subtle" style="margin-top:6px">Assigning a TODO or PLANNED function automatically starts it and changes its status to IN PROGRESS.</div></div>${f.status==='BLOCKED'||f.blocked_reason?`<div class="field"><label>BLOCKER REASON</label><textarea class="textarea" placeholder="What is preventing this function from progressing?" ${unlocked()?'':'disabled'} onblur="if(this.value!==${JSON.stringify(f.blocked_reason||'')}) mutate({action:'update_function',id:'${f.id}',patch:{blocked_reason:this.value}})">${esc(f.blocked_reason||'')}</textarea>${f.status==='BLOCKED'&&!f.blocked_reason?.trim()?'<div class="locked" style="margin-top:6px">⚠ Add a blocker reason so the team knows what needs resolving.</div>':''}</div>`:''}<div class="field"><label>DEPENDENCIES</label>${unfinished.length?`<div class="attention"><strong>Prerequisite warning</strong><p>${unfinished.map(d=>esc(d.name)+' is '+fmt(d.status)).join(' • ')}</p></div>`:''}<div class="dep-list">${deps.map(d=>`<div class="dep-item ${dependencyReady(d)?'dep-good':'dep-bad'}"><div class="dep-main"><button class="mini-link dep-name" onclick="openDrawer('${d.id}',false)">${esc(d.name)}</button><div class="dep-meta">${fmt(d.status)} · ${esc(memberName(d.assignee_member_id))}</div></div>${unlocked()?`<button class="mini-remove" onclick="removeDependency('${f.id}','${d.id}')">Remove</button>`:''}</div>`).join('')||'<div class="text">No direct dependencies.</div>'}</div>${unlocked()&&candidates.length?`<div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px"><select id="depSelect" class="select"><option value="">Add dependency…</option>${candidates.map(x=>`<option value="${x.id}">${esc(x.name)} · ${fmt(x.status)}</option>`).join('')}</select><button class="btn" onclick="addDependency('${f.id}')">Add</button></div>`:''}</div><div class="field"><label>USED BY</label><div class="dep-tags">${down.map(x=>`<button class="dep-tag" onclick="openDrawer('${x.id}',false)">${esc(x.name)}</button>`).join('')||'<span class="text">No downstream functions.</span>'}</div></div><div class="field"><label>WHAT IT DOES</label><div class="text">${esc(f.what_it_does||f.task||'—')}</div></div><div class="field"><label>INPUT</label><div class="text">${esc(f.input_description||'—')}</div></div><div class="field"><label>OUTPUT</label><div class="text">${esc(f.output_description||'—')}</div></div><div class="field"><label>WHY WE NEED IT</label><div class="text">${esc(f.rationale||'—')}</div></div><div class="field"><label>EXAMPLE OUTPUT</label><code>${esc(f.example_output||'—')}</code></div><div class="field"><label>IMPLEMENTATION PATH</label><input class="input" value="${esc(f.source_path||'')}" ${unlocked()?'':'disabled'} onchange="mutate({action:'update_function',id:'${f.id}',patch:{source_path:this.value}})"></div><div class="field"><label>IMPLEMENTATION NOTES</label><textarea id="implementationNotes" class="textarea" ${unlocked()?'':'disabled'} oninput="const s=document.querySelector('#notesSaveStatus');if(s)s.textContent='Unsaved changes'" placeholder="Record implementation details, decisions, edge cases, and handoff notes…">${esc(f.implementation_notes||'')}</textarea><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px"><span id="notesSaveStatus" class="subtle">${f.implementation_notes?.trim()?'Saved note loaded':'No saved notes yet'}</span><button id="saveNotesButton" class="btn primary" ${unlocked()?'':'disabled'} onclick="saveImplementationNotes('${f.id}')">Save notes</button></div></div><div class="field"><label>COMMENTS</label>${comments.map(c=>`<div class="comment"><div class="who">${esc(c.author_member?.display_name||'Member')}</div><div class="body">${esc(c.body)}</div><div class="when">${new Date(c.created_at).toLocaleString()}</div></div>`).join('')||'<div class="text">No comments yet.</div>'}${unlocked()?`<div style="margin-top:10px"><select id="commentMember" class="select"><option value="">Choose author…</option>${state.members.map(m=>`<option value="${m.id}">${esc(m.display_name)}</option>`).join('')}</select><textarea id="commentBody" class="textarea" placeholder="Add a note or review comment…" style="margin-top:8px"></textarea><button class="btn primary" onclick="addComment('${f.id}')">Add comment</button></div>`:''}</div></div>`;if(show)drawer.classList.add('open')}
async function addDependency(fid){const el=document.querySelector('#depSelect'),did=el?.value;if(!did){toast('Choose a dependency');return}await mutate({action:'add_dependency',function_id:fid,depends_on_id:did})}
async function removeDependency(fid,did){await mutate({action:'remove_dependency',function_id:fid,depends_on_id:did})}
async function saveImplementationNotes(fid){
  const el=document.querySelector('#implementationNotes'),status=document.querySelector('#notesSaveStatus'),button=document.querySelector('#saveNotesButton');
  if(!el)return;
  let key=localStorage.getItem('gnnAccessKey');
  if(!key){await unlock();key=localStorage.getItem('gnnAccessKey');if(!key)return}
  const value=el.value;
  try{
    if(status)status.textContent='Saving…';
    if(button)button.disabled=true;
    await api({action:'update_function',key,id:fid,patch:{implementation_notes:value}});
    const local=state.functions.find(f=>f.id===fid);if(local)local.implementation_notes=value;
    if(status)status.textContent='Saved';
    toast('Implementation notes saved');
  }catch(e){
    if(/key/i.test(e.message))localStorage.removeItem('gnnAccessKey');
    if(status)status.textContent='Save failed';
    toast(e.message);
  }finally{
    if(button)button.disabled=false;
  }
}
function closeDrawer(){document.querySelector('#drawer').classList.remove('open');selected=null}
async function addComment(fid){const m=document.querySelector('#commentMember').value,b=document.querySelector('#commentBody').value.trim();if(!m||!b){toast('Choose an author and write a comment');return}await mutate({action:'add_comment',function_id:fid,author_member_id:m,body:b})}
async function addMember(){if(!unlocked()){await unlock();if(!unlocked())return}const n=prompt('Member display name');if(n?.trim())await mutate({action:'add_member',display_name:n.trim()})}
document.querySelector('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});load().catch(e=>{document.querySelector('#app').innerHTML='<div class="empty">Failed to load workspace: '+esc(e.message)+'</div>'});setInterval(()=>load().catch(()=>{}),30000);
</script></body></html>
